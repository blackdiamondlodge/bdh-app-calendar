[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdh-app-calendar"
version = "1.0.3"
description = "Black Diamond Hub app: a family calendar merging iCal feeds with events added on the hub"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "bdh-sdk>=0.16,<1",
    "icalendar>=6",
    "recurring-ical-events>=3",
    "x-wr-timezone>=1",
    "python-dateutil",
    "requests",
]

[project.urls]
Source = "https://github.com/blackdiamondlodge/bdh-app-calendar"

[project.entry-points."blackdiamondhub.plugins"]
hub_calendar = "hub_calendar.plugin:spec"

[tool.setuptools.packages.find]
include = ["hub_calendar", "hub_calendar.*"]

[tool.setuptools.package-data]
hub_calendar = [
    "templates/**/*",
    "static/**/*",
    "migrations/*.py",
]
